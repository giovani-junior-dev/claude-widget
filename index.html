<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'">
<title>Consumo de IA</title>
<style>
  :root{
    --ink:#000;
    --tile:#1C1C1E; --tile-hi:#2C2C2E; --hair:rgba(255,255,255,.08); --hair-hi:rgba(255,255,255,.14);
    --text:#F5F5F7; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.34);
    --track:rgba(255,255,255,.12);
    --ok:#30D158; --warn:#FFD60A; --crit:#FF453A;
    --spring:cubic-bezier(.3,1.25,.45,1);
    --ease:cubic-bezier(.2,.8,.2,1);
    --display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --body:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}
  body{
    font-family:var(--body);font-size:13px;color:var(--text);
    -webkit-font-smoothing:antialiased;user-select:none;cursor:default;
  }
  button{font:inherit;color:inherit}
  img{display:block;-webkit-user-drag:none}
  .num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* ---------------------------------------------------------- a ilha */
  #island{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:236px;height:38px;border-radius:19px;background:var(--ink);overflow:hidden;
    box-shadow:0 0 0 .5px var(--hair-hi) inset,0 14px 40px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.3);
    transition:width .55s var(--spring),height .55s var(--spring),border-radius .55s var(--spring);
  }
  #island[data-mode="overview"],#island[data-mode="detail"]{border-radius:30px}
  /* alerta: a borda respira em vermelho, como uma Live Activity urgente */
  #island.alarm::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,69,58,.55) inset;animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{50%{box-shadow:0 0 0 1px rgba(255,69,58,.15) inset}}

  .view{
    position:absolute;top:0;left:50%;transform:translateX(-50%) scale(.94);
    opacity:0;filter:blur(8px);pointer-events:none;
    transition:opacity .28s var(--ease),filter .32s var(--ease),transform .5s var(--spring);
  }
  .view.on{opacity:1;filter:blur(0);transform:translateX(-50%) scale(1);pointer-events:auto;transition-delay:.06s}

  /* ---------------------------------------------------------- pilula */
  #pill{height:38px;display:flex;align-items:center;white-space:nowrap;cursor:pointer;width:max-content}
  .slide{display:flex;align-items:center;gap:9px;padding:0 9px 0 11px;height:38px;animation:slideIn .55s var(--spring)}
  @keyframes slideIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
  .slide .logo{width:18px;height:18px}
  .slide .who{font-weight:600;font-size:12.5px;letter-spacing:.01em}
  .slide .what{font-size:12px;color:var(--muted);margin-left:2px}
  .slide .pct{margin-left:10px;font-size:14px;font-weight:600}
  .dots{display:flex;gap:3px;margin-left:4px}
  .dots i{width:4px;height:4px;border-radius:99px;background:var(--faint);transition:background .3s,transform .3s}
  .dots i.on{background:var(--text);transform:scale(1.25)}

  /* anel: track + arco; o arco anima pelo dashoffset */
  .ring{display:block;transform:rotate(-90deg);flex:none}
  .ring circle{fill:none}
  .ring .t{stroke:var(--track)}
  .ring .a{stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease),stroke .4s}

  /* ---------------------------------------------------------- visao geral */
  #overview{width:420px;padding:14px 10px 10px}
  .head{display:flex;align-items:center;gap:8px;padding:2px 8px 10px}
  .head .title{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.01em}
  .head .sub{font-size:11.5px;color:var(--faint)}
  .head .sp{flex:1}
  .icon-btn{
    width:28px;height:28px;border:0;border-radius:99px;background:var(--tile);color:var(--muted);
    display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,color .2s,transform .2s var(--spring);
  }
  .icon-btn:hover{background:var(--tile-hi);color:var(--text)}
  .icon-btn:active{transform:scale(.9)}
  .icon-btn:focus-visible{outline:2px solid var(--text);outline-offset:1px}
  .icon-btn svg{width:14px;height:14px}
  .icon-btn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .list{display:flex;flex-direction:column;gap:2px}
  .card{
    display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:18px;border:0;background:transparent;
    width:100%;text-align:left;cursor:pointer;transition:background .2s;
  }
  .card:hover{background:rgba(255,255,255,.06)}
  .card:focus-visible{outline:2px solid var(--hair-hi);outline-offset:-2px}
  .tile{width:38px;height:38px;border-radius:11px;background:var(--tile);display:grid;place-items:center;flex:none;position:relative}
  .tile img{width:21px;height:21px}
  .tile .st{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:99px;border:2px solid var(--ink);background:var(--warn)}
  .tile .st[hidden]{display:none}
  .card .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .card .line1{display:flex;align-items:center;gap:7px}
  .card .name{font-weight:600;font-size:13.5px}
  .plan{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--tile);padding:2px 6px;border-radius:99px}
  .plan:empty{display:none}
  .card .when{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
  .mini{display:flex;align-items:center;gap:8px}
  .mini .bar{flex:1}
  .mini .lbl{font-size:10.5px;color:var(--faint);width:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .v{font-size:11px;color:var(--muted);width:30px;text-align:right}
  .gaugebox{position:relative;width:44px;height:44px;flex:none}
  .gaugebox .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600}
  .gaugebox .v small{font-size:8px;color:var(--muted);margin-left:1px}

  .bar{position:relative;height:5px;border-radius:99px;background:var(--track);overflow:hidden}
  .bar i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);border-radius:99px;transition:transform .8s var(--ease),background .4s}

  /* ---------------------------------------------------------- detalhe */
  #detail{width:420px;padding:14px 16px 12px}
  #detail .head{padding:2px 0 6px}
  .back{margin-right:2px}
  .hero{display:flex;align-items:center;gap:18px;padding:12px 4px 16px}
  .hero .gaugebox{width:104px;height:104px}
  .hero .gaugebox .v{font-size:30px;font-weight:600;padding-bottom:6px}
  .hero .gaugebox .v small{font-size:13px}
  .hero .gaugebox .cap{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;font-size:8.5px;letter-spacing:.05em}
  .hero .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
  .eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .countdown{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
  .hero .at{font-size:12px;color:var(--muted)}

  .banner{display:none;gap:9px;align-items:flex-start;margin:4px 0 12px;padding:10px 12px;border-radius:14px;background:rgba(255,214,10,.1);color:#FFE58A;font-size:12px;line-height:1.45}
  .banner.on{display:flex}
  .banner.crit{background:rgba(255,69,58,.12);color:#FFB3AD}
  .group{background:var(--tile);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;margin-bottom:10px}
  .group:empty{display:none}
  .row{display:flex;flex-direction:column;gap:7px}
  .row .top{display:flex;align-items:baseline;gap:8px}
  .row .name{font-size:12.5px;font-weight:600}
  .row .when{font-size:11px;color:var(--faint)}
  .row .val{margin-left:auto;font-size:14px;font-weight:600}
  .row .bar{height:6px}
  .money{margin-left:auto;font-size:15px;font-weight:600}
  .money span{color:var(--faint);font-size:11.5px;font-weight:400}
  .note{font-size:11px;line-height:1.45;color:var(--faint);padding:0 4px 6px}
  .note:empty{display:none}
  .foot{display:flex;align-items:center;gap:7px;padding:4px 4px 0;font-size:11px;color:var(--faint)}
  .foot .dot{width:6px;height:6px;border-radius:99px;background:var(--ok)}
  .foot .sp{flex:1}
  .link{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:6px;font-size:11px}
  .link:hover{color:var(--text)}

  /* tokens por modelo (so Claude) */
  .tokens[hidden]{display:none}
  .tokens .tophead{display:flex;align-items:center;gap:8px}
  .seg{display:flex;margin-left:auto;background:rgba(255,255,255,.06);border-radius:99px;padding:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--tile-hi);color:var(--text)}
  .spinner{width:10px;height:10px;border-radius:99px;border:1.5px solid var(--track);border-top-color:var(--text);animation:spin .7s linear infinite}
  .spinner[hidden]{display:none}
  #tokens-list{max-height:220px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;padding-right:2px}
  #tokens-list::-webkit-scrollbar{width:5px}
  #tokens-list::-webkit-scrollbar-thumb{background:var(--track);border-radius:99px}
  .trow .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow.alien .name{color:var(--muted);font-weight:400}
  .empty{font-size:12px;color:var(--muted)}

  body.stale .val,body.stale .money,body.stale .hero .v{color:var(--muted)}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="island" data-mode="pill">

  <div class="view on" id="pill" role="button" tabindex="0" aria-label="Abrir painel de consumo"></div>

  <div class="view" id="overview">
    <div class="head">
      <div>
        <div class="title">Consumo de IA</div>
        <div class="sub" id="ov-sub"></div>
      </div>
      <span class="sp"></span>
      <button class="icon-btn" id="ov-refresh" title="Atualizar tudo" aria-label="Atualizar tudo">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
      </button>
      <button class="icon-btn" id="ov-hide" title="Recolher para a bandeja" aria-label="Recolher para a bandeja">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h8"/></svg>
      </button>
    </div>
    <div class="list" id="cards"></div>
  </div>

  <div class="view" id="detail">
    <div class="head">
      <button class="icon-btn back" id="dt-back" title="Voltar" aria-label="Voltar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
      </button>
      <div class="tile" style="width:30px;height:30px;border-radius:9px"><img id="dt-logo" src="assets/logos/claude.svg" alt="" style="width:17px;height:17px"></div>
      <div class="title" id="dt-name"></div>
      <span class="plan" id="dt-plan"></span>
      <span class="sp"></span>
      <button class="icon-btn" id="dt-refresh" title="Atualizar" aria-label="Atualizar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
      </button>
    </div>

    <div class="banner" id="dt-banner"><span id="dt-banner-text"></span></div>

    <div class="hero">
      <div class="gaugebox" id="dt-gauge">
        <div class="v num" id="dt-pct">—</div>
        <div class="cap" id="dt-cap"></div>
      </div>
      <div class="meta">
        <span class="eyebrow" id="dt-eyebrow">reinicia em</span>
        <span class="countdown" id="dt-countdown">—</span>
        <span class="at" id="dt-at"></span>
      </div>
    </div>

    <div class="group" id="dt-rows"></div>
    <div class="group" id="dt-spend" hidden></div>

    <div class="group tokens" id="dt-tokens" hidden>
      <div class="tophead">
        <span class="eyebrow">tokens por modelo</span>
        <span class="spinner" id="tk-spinner" hidden></span>
        <div class="seg" id="tk-range" role="group" aria-label="Período">
          <button type="button" data-days="7">7 d</button>
          <button type="button" data-days="30">30 d</button>
          <button type="button" data-days="90">90 d</button>
        </div>
      </div>
      <div id="tokens-list"></div>
      <div class="note" id="tk-note" style="padding:0"></div>
    </div>

    <div class="note" id="dt-note"></div>

    <div class="foot">
      <span class="dot" id="dt-dot"></span>
      <span id="dt-status"></span>
      <span class="sp"></span>
      <button class="link" id="dt-tokens-toggle" hidden>tokens por modelo</button>
      <span id="dt-ago"></span>
    </div>
  </div>

</div>
<script src="renderer.js"></script>
</body>
</html>
